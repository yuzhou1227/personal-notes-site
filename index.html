<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>个人笔记</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dark.css">
<link rel="stylesheet" href="css/highlight-light.css">
<link rel="stylesheet" href="css/highlight-dark.css">
<link rel="stylesheet" href="css/quill.css">
<link rel="stylesheet" href="css/quill-theme.css">
<script>
// ════════════════════════════════════════
// 配置 — 修改下面的值以匹配你的仓库
// ════════════════════════════════════════
window.__NOTE_OWNER = 'yuzhou1227';
window.__NOTE_REPO  = 'personal-notes-site';
window.__NOTE_BRANCH = 'master';
</script>
</head>
<body>
<div id="atmosphere"></div>
<div id="app">
  <nav id="topNav">
    <button id="menuToggle" aria-label="切换菜单">☰</button>
    <span id="logo"><span class="logo-icon">📓</span>个人笔记</span>
    <div id="searchBox">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索笔记..." />
    </div>
    <div id="userArea">
      <button id="themeToggle" title="切换主题" style="background:none;border:none;cursor:pointer;font-size:16px;padding:4px 8px;color:var(--text-secondary)">🌓</button>
      <div id="userAvatar">Y</div>
    </div>
  </nav>

  <div id="mainLayout">
    <aside id="sidebar">
      <div id="sidebarHeader">
        <span class="sidebar-title">目录</span>
        <button id="newNoteQuick" title="新建笔记">＋</button>
      </div>
      <div id="fileTree"></div>
    </aside>

    <main id="content">
      <div id="progressBar" style="display:none">
        <div id="progressFill"></div>
        <span id="progressText"></span>
      </div>
      <div id="breadcrumb"></div>
      <div id="articleContent">
        <div id="welcomeMessage">
          <div class="welcome-card">
            <div class="welcome-icon">📓</div>
            <h1>个人笔记</h1>
            <p>推送 .md 文件到 <strong>notes/</strong> 目录即可自动加载</p>
            <div class="welcome-hint">
              💡 在侧边栏点击笔记浏览 · 悬停文件可重命名/删除<br>
              ✏️ 点击右下角编辑按钮进入 WYSIWYG 编辑器
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="sidebarOverlay"></div>
<div id="toast"></div>

<script src="js/highlight.js"></script>
<script src="js/markdown.js"></script>
<script src="js/outline.js"></script>
<script src="js/cache.js"></script>
<script src="js/search.js"></script>
<script src="js/file-tree.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
<script src="js/quill.js"></script>
<script src="js/turndown.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
